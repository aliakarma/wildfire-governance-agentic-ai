# Canonical paper-artifact manifest — the single source of truth mapping every
# manuscript table/figure to (1) its manuscript reference, (2) the committed CSV,
# (3) the experiment script that produces it, (4) the dashboard route that shows
# it, and (5) the key metrics + rerun tolerance.
#
# Decisions in force:
#   * results/paper/ holds the manuscript's values, and only those. Every file is
#     emitted by scripts/generate_all_paper_results.py from the per-seed metric
#     files in per_seed/ (plus live closed-form computation); none is hand-edited.
#   * scripts/verify_paper_alignment.py re-checks every emitted cell against
#     Paper/AAAI/Wildfire.tex. Manuscript and results can never silently diverge.
#   * Claims the simulation could not support were REMOVED from the manuscript
#     rather than the simulation adjusted to fit them. See `withdrawn:` below.
#   * Items marked supplementary are NOT in the manuscript and must be badged
#     "Supplementary" in the dashboard.
#
# status legend:  ok = script + csv + dashboard all present and consistent
#                 needs_script | needs_dashboard | pending
#
# NOTE: a few committed files keep a legacy basename where the checker and the
# aggregator already agree on it (e.g. fig3_latency_data.csv == Figure 3). `csv`
# is the authoritative current filename.

meta:
  n_uavs_default: 20
  n_seeds_default: 20
  tolerance_default: 0.05          # 5% relative, rerun-to-rerun seed noise
  paper: Paper/AAAI/Wildfire.tex
  aggregator: scripts/generate_all_paper_results.py
  alignment_gate: scripts/verify_paper_alignment.py
  seed_bundles: scripts/rebuild_per_seed_bundles.py

tables:
  - id: table1_rl_comparison
    paper_ref: "Table 1 (tab:rl_comparison)"
    csv: table1_rl_comparison.csv
    per_seed: per_seed/table1_rl_comparison_per_seed.csv
    script: experiments/11b_rl_comparison.py
    dashboard: Benchmark
    methods: [PPO-GOMDP, Greedy-GOMDP, Central+Sig, Shield-PPO, SafeLayer, PPO-CMDP, WCSAC, Adaptive AI, Static]
    metrics: [ld_mean, fp_mean, fn_mean, compliance_pct]
    status: ok

  - id: table2_ablation
    paper_ref: "Table 2 (tab:ablation)"
    csv: table2_ablation.csv
    per_seed: per_seed/table2_ablation_per_seed.csv
    script: experiments/02_ablation_study.py
    dashboard: Ablation
    metrics: [ld_mean, fp_mean, injections_blocked]
    exact_cols: [injections_blocked, injections_total]
    status: ok

  - id: table_config_parameters
    paper_ref: "Table 4 (tab:params)"
    csv: table_config_parameters.csv
    script: null                     # a specification, not a measurement
    dashboard: Experiments
    provenance: specification
    status: ok

  - id: table_main_comparison
    paper_ref: "Table 5 (tab:main_comparison, full metric)"
    csv: table1_rl_comparison_main.csv
    per_seed: per_seed/table3_main_comparison_per_seed.csv
    script: experiments/01_main_comparison.py
    dashboard: Statistics
    metrics: [ld_mean, fp_mean, fn_mean, bc_delay_mean, human_review_mean, compliance_pct, gov_overhead_pct]
    status: ok

  - id: table3_adversarial
    paper_ref: "Table 6 (tab:adversarial)"
    csv: table3_adversarial.csv
    per_seed: per_seed/table3_adversarial_per_seed.csv
    script: experiments/09_adversarial_robustness.py
    dashboard: Adversarial
    metrics: [gomdp, central_sig, central]
    exact_cols: [injection_ratio]     # 0/100, 0/100, 100/100 — deterministic
    status: ok

  - id: table4_realworld_viirs
    paper_ref: "Table 7 (tab:realworld) — VIIRS, 3 events"
    csv: table4_realworld_viirs.csv
    per_seed: per_seed/table4_realworld_viirs_per_seed.csv
    script: [experiments/08_viirs_california.py, experiments/08b_viirs_mediterranean.py, experiments/08c_viirs_australia.py]
    dashboard: VIIRS
    metrics: [ld_mean, fp_mean, gov_compliance_pct]
    status: ok

  - id: table5_byzantine
    paper_ref: "Table 8 (tab:byzantine) — validator compromise, k=7 f=2"
    csv: [table5_byzantine_theory.csv, table5_byzantine_empirical.csv]
    script: experiments/13_byzantine_compromise.py
    dashboard: Adversarial (consensus panel)
    metrics: [p_break_gomdp, p_break_sig, breach, fp_pct]
    tolerance: 0.02                   # closed form -> exact
    status: ok

  - id: table6_ksweep
    paper_ref: "Table 9 (tab:ksweep) — validator-count sweep, p_c=0.10"
    csv: table6_ksweep.csv
    script: experiments/14_ksweep.py
    dashboard: Adversarial (consensus panel)
    metrics: [p_break_gomdp_theory, empirical]
    tolerance: 0.02
    monte_carlo: {trials: 10000, seed: 1}   # mirrored in the aggregator
    status: ok

  - id: table7_hitl_sensitivity
    paper_ref: "Table 10 (tab:hitl_sensitivity) — p_err sweep, PPO-GOMDP"
    csv: table7_hitl_sensitivity.csv
    per_seed: per_seed/table7_hitl_sensitivity_per_seed.csv
    script: experiments/06b_hitl_sensitivity.py
    dashboard: HITL
    metrics: [fn_mean, fp_mean, gov_compliance_pct]
    exact_cols: [gov_compliance_pct]   # pinned 100% by Theorem 1
    status: ok

  - id: table9_multisig
    paper_ref: "Table 11 (tab:multisig) — m-of-n multisig"
    csv: table9_multisig.csv
    per_seed: per_seed/table9_multisig_per_seed.csv
    script: experiments/16_multisig.py
    dashboard: Adversarial (consensus panel)
    metrics: [ld_mean, fp_mean, injections_blocked]
    exact_cols: [injections_blocked, injections_total]
    status: ok

  - id: statistical_tests
    paper_ref: "Sec. 6.2 (Statistical Testing) + abstract TOST claim"
    csv: statistical_tests.csv
    per_seed: per_seed/table1_rl_comparison_per_seed.csv
    script: scripts/generate_all_paper_results.py
    dashboard: Statistics
    metrics: [statistic, p_value, effect_size_d]
    notes: |
      Seeds 0-19 are common random numbers across configurations, so every
      comparison is paired; Holm-Bonferroni controls family-wise error. The
      PPO-GOMDP vs PPO-CMDP latency claim is an EQUIVALENCE claim, tested by TOST
      with an a-priori margin of one blockchain-commit delay (+/-1.2 steps).
    status: ok

figures:
  - id: fig2_false_alerts
    paper_ref: "Figure 2 (fig:falsealerts) — F_p vs N"
    csv: fig2_false_alerts.csv
    per_seed: per_seed/fig2_false_alerts_per_seed.csv
    script: experiments/04b_false_alert_scaling.py
    dashboard: Scalability
    series: [PPO-GOMDP, Greedy-GOMDP, PPO-CMDP, WCSAC, Adaptive AI, Static]
    status: ok

  - id: fig3_learning_curve
    paper_ref: "Sec. 5.2 training convergence (fig:learning in the extended version)"
    csv: fig3_learning_curve.csv
    script: experiments/11_ppo_training.py
    dashboard: Learning
    provenance: training-derived
    series: [validation L_d (5 held-out seeds), Greedy-GOMDP baseline]
    notes: |
      Backs the manuscript's Sec. 5.2 claim that validation L_d plateaus at 15.1
      by episode 650 and the early-stopping criterion fires by episode 750.
      Training-derived: produced by rerunning training, not by the evaluation
      aggregator, so scripts/generate_all_paper_results.py does not emit it.
    status: ok

  - id: fig3_latency
    paper_ref: "Figure 3 (fig:latency) — L_d vs N"
    csv: fig3_latency_data.csv          # legacy basename
    per_seed: per_seed/fig3_latency_data_per_seed.csv
    script: experiments/03_scalability.py
    dashboard: Scalability
    series: [PPO-GOMDP, Greedy-GOMDP, PPO-CMDP, WCSAC, Adaptive AI, Static]
    status: ok

supplementary:                          # NOT in the manuscript — badge "Supplementary"
  - id: tradeoff_frontier
    csv: [figure3_tradeoff_frontier.csv, fig5_tradeoff_data.csv]
    per_seed: per_seed/fig5_tradeoff_data_per_seed.csv
    script: experiments/05_tradeoff_frontier.py
    dashboard: Benchmark (badged Supplementary)
    note: Pareto L_d / F_p at N=40; consistent with the N=40 column of Figures 2-3.

# Artifacts WITHDRAWN from the manuscript. Retained here as a record of what was
# removed and why; these have no paper_ref because they no longer appear, no
# committed CSV, and no dashboard route.
withdrawn:
  - id: table8_recent_rl
    former_ref: "Table (tab:recent_rl) — SafeDreamer, CCPO"
    reason: |
      experiments/15_recent_rl.py evaluated calibrated STAND-INS on the shared
      constrained-baseline path, not implementations of SafeDreamer or CCPO; the
      two rows differed only by a HITL rejection knob. Presenting them as
      evaluations of those published methods was not supportable, so the
      comparison was removed. Both are now cited as related work only, and the
      manuscript states explicitly that a controlled comparison is future work.

  - id: table10_cnn_ablation
    former_ref: "Table (tab:cnn_ablation) — MLP vs CNN"
    reason: |
      No CNN encoder was ever trained; the convergence-episode and parameter
      figures had no run behind them. Removed. The manuscript now states that a
      convolutional encoder was not evaluated and that whether one would help
      remains open.

  - id: table_fabric_microbench
    former_ref: "Appendix (app:fabric) — Fabric consensus-latency microbenchmark"
    reason: |
      The paper reported a "7-peer Fabric 2.5 deployment ... 2.3+/-0.7 s over 1000
      transactions" as a first-person measurement. No Fabric network, chaincode,
      or peer deployment exists in this repository; the consensus model is a
      Python simulation. This also contradicted the architecture caption's "no
      blockchain was deployed". The claim was withdrawn and the Limitations
      section now states that consensus is simulated.

  - id: proposition1_bound
    former_ref: "Proposition 1 latency bound (column of fig3_latency_data.csv)"
    reason: |
      The manuscript contains no Proposition 1; the column and the dashboard
      series that plotted it referenced a result that does not exist. Both removed.

# Known cosmetic mismatches, deliberately left alone:
known_cosmetic:
  - "10_stress_testing.py writes fig6_stress_test_data.csv to results/runs/. The
     stress test is not a manuscript figure and has no committed paper CSV; the
     previously committed figure2_stress_tests.* was an incomplete smoke run
     (half the series empty) and was removed."
  - "04b_false_alert_scaling.py sweeps perfect-square fleet sizes {4,8,16,...}
     (required by the coordination tiling) while Figure 2 uses {5,10,20,40}; the
     monotone F_p-vs-N decrease is reproduced but the join keys are disjoint, so
     scripts/check_reproducibility.py reports the diff as [KNOWN]. Closing this
     needs the tiling to support non-square N."
