# Live-vs-paper alignment gaps surfaced by check_reproducibility.py (all reported
# [KNOWN], never fatal; the checker prints the precise reason for each):
known_gaps:
  - "02_ablation_study.py: REWORKED (WS4) to emit the canonical schema (config + injections_blocked/injections_total, all 8 paper rows). The injection-blocking column is now verified EXACTLY (2%) through its own live injection run (100/100 enforced, 0/100 no-auth). L_d/F_p magnitudes remain the universal documented calibration deviation."
  - "01_main_comparison.py: REWORKED (WS4) to emit the canonical schema (config = method id, all 6 paper rows + bc_delay/human_review/le2e/ld_reduction/n_seeds). bc_delay (1.2), human_review (3.0) and n_seeds reproduce exactly; L_d/F_p and the L_d-derived columns remain documented calibration deviations."
  - "04b_false_alert_scaling.py sweeps perfect-square fleet sizes {4,8,16,...} (required by the coordination tiling) while Fig 2 uses {5,10,20,40}; the monotone F_p-vs-N decrease is reproduced but join keys are disjoint, so the diff is reported [KNOWN]. Closing this needs the tiling to support non-square N."
